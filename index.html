#pg{cursor:pointer;text-decoration:underline dotted;padding:6px}
body.focus header,body.focus footer{display:none}
#fxw{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:8;opacity:.7;display:none;gap:6px}

#dim,#warm{position:fixed;inset:0;pointer-events:none;opacity:0}

header b{color:var(--acc);font-weight:600}

.w.sv{background:linear-gradient(transparent 62%,var(--accsoft) 62%)}
.w.rd{background:var(--acc);color:#fff}
.w.on{background:var(--accsoft);box-shadow:0 0 0 2px var(--accsoft)}

#tip small{display:block;font-weight:400;font-size:12px;opacity:.85}

.setup h1{font-size:22px;margin:0 0 8px}

.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.file{position:relative;overflow:hidden;display:inline-block}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.hint{color:var(--mute);font-size:14px;margin:0 0 12px}

#menu .mh span{font-weight:600;color:var(--acc);font-size:19px}

function tr(w){
  w=w.toLowerCase().replace(/’/g,"'");
  const c=[w],s=(a)=>c.push(a);
  if(w.endsWith("'s"))s(w.slice(0,-2));
  if(w.endsWith("ies"))s(w.slice(0,-3)+"y");
  if(w.endsWith("es"))s(w.slice(0,-2));
  if(w.endsWith("s"))s(w.slice(0,-1));
  if(w.endsWith("ed")){s(w.slice(0,-2));s(w.slice(0,-1));if(w[w.length-3]===w[w.length-4])s(w.slice(0,-3))}
  if(w.endsWith("ing")){const b=w.slice(0,-3);s(b);s(b+"e");if(b[b.length-1]===b[b.length-2])s(b.slice(0,-1))}
  if(w.endsWith("ly"))s(w.slice(0,-2));
  if(w.endsWith("ied"))s(w.slice(0,-3)+"y");
  if(w.endsWith("er")){s(w.slice(0,-2));s(w.slice(0,-1))}
  if(w.endsWith("est")){s(w.slice(0,-3));s(w.slice(0,-2))}
  if(w.endsWith("ier")||w.endsWith("iest"))s(w.replace(/ie(r|st)$/,"y"));
  if(w.endsWith("ness"))s(w.slice(0,-4));
  const m=w.match(/^(.+)'(ll|re|ve|m|d)$/);if(m)s(m[1]);
  for(const k of c)if(D[k])return D[k];
  return null;
}

    const gap=i?lines[i-1].y-l.y:0,np=i>0&&((med>0&&gap>med*1.35)||l.x>mx+l.h*1.2);
    if(!c)c=l.t;
    else if(np){paras.push(c);c=l.t}
    else if(/-$/.test(c)&&/^[a-z]/.test(l.t))c=c.slice(0,-1)+l.t;
    else c+=" "+l.t;
  });
  if(c)paras.push(c);
  return paras.join("\n\n");
}
async function pdfPages(f){
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,L=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
    const it=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({s:x.str,x:x.transform[4],y:x.transform[5],h:Math.abs(x.transform[3])||10,w:x.width||0}));
    if(vp.width>vp.height*1.15){L.push(pdfLines(it.filter(t=>t.x<vp.width/2)));L.push(pdfLines(it.filter(t=>t.x>=vp.width/2)))}
    else L.push(pdfLines(it));
  }
  const cnt={},nm=l=>l.t.toLowerCase().replace(/\d+/g,"#");
  L.forEach(ls=>{new Set(ls.map(nm)).forEach(k=>{cnt[k]=(cnt[k]||0)+1})});
  return L.map(ls=>pageText(ls.filter(l=>!(L.length>=6&&cnt[nm(l)]>=3&&cnt[nm(l)]>=L.length*0.3&&l.t.length<60))));
}
const BAD=/isbn|copyright|©|all rights reserved|published by|first published|pearson|penguin readers|series editor|printed in|edinburgh gate|longman|www\.|impression|activities|contents/i;
function isProse(t){const w=t.split(/\s+/).filter(Boolean).length,s=(t.match(/[.!?]/g)||[]).length;return w>=20&&s>=2&&!BAD.test(t)}
function pdfFix(pgs,title){
  const n=pgs.length;
  let a=pgs.findIndex(isProse);if(a<0)a=0;
  let b=n-1;while(b>a&&!isProse(pgs[b]))b--;
  $("foot").hidden=true;
  $("main").innerHTML='<div class="setup"><h1>Проверьте текст</h1><p class="hint">Прочитано страниц: '+n+'. Начало и конец найдены автоматически — проверьте и при необходимости сдвиньте ползунки.</p><p class="hint" style="margin-top:10px">Начать со страницы: <b id="av"></b></p><input id="ar" type="range" min="1" max="'+n+'" style="width:100%"><div id="ap" style="font-size:14px;color:var(--mute);margin:6px 0 14px;white-space:pre-wrap"></div><p class="hint">Закончить на странице: <b id="ev"></b></p><input id="er" type="range" min="1" max="'+n+'" style="width:100%"><div id="ep" style="font-size:14px;color:var(--mute);margin:6px 0 14px;white-space:pre-wrap"></div><div class="row"><button class="main" id="pgo">Читать</button><button id="pcx">Отмена</button></div></div>';
  const draw=()=>{
    $("av").textContent=a+1;$("ev").textContent=b+1;$("ar").value=a+1;$("er").value=b+1;
    $("ap").textContent=(pgs[a]||"(пустая страница)").slice(0,260)+" …";
    $("ep").textContent="… "+(pgs[b]||"(пустая страница)").slice(-200);
  };
  $("ar").oninput=()=>{a=+$("ar").value-1;if(b<a)b=a;draw()};
  $("er").oninput=()=>{b=+$("er").value-1;if(a>b)a=b;draw()};
  $("pgo").onclick=()=>start(pgs.slice(a,b+1).filter(Boolean).join("\n\n"),0,title);
  $("pcx").onclick=setup;
  draw();
}
async function mm(q){
  if(!navigator.onLine)throw{mm:1,message:"Нет интернета."};
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?langpair=en|ru&q="+encodeURIComponent(q),{signal:c.signal});
    const j=await r.json();let t=((j.responseData||{}).translatedText||"").trim();
    if(j.responseStatus==429||/MYMEMORY WARNING/i.test(t))throw{mm:1,message:"Дневной лимит бесплатного переводчика исчерпан. Попробуйте завтра."};
    if(!t||j.responseStatus!=200)throw{mm:1,message:"Переводчик не вернул ответ."};
    const d=document.createElement("textarea");d.innerHTML=t;t=d.value;
    return /^[a-z]/.test(q)?t.charAt(0).toLowerCase()+t.slice(1):t;
  }catch(e){if(e&&e.mm)throw e;throw{mm:1,message:"Не удалось связаться с переводчиком (нет сети или он недоступен)."}}
  finally{clearTimeout(tm)}
}
function whyFail(e){
  if(e&&e.mm)return e.message;
  if(!window.claude)return "Эта страница открыта вне Claude (например, в обычном браузере), поэтому переводчик недоступен. Откройте её из приложения Claude.";
  if(e===0||e===undefined)return "Claude здесь недоступен: либо вы не дали разрешение, либо страница открыта вне приложения Claude.";
  if(e.code==="not_granted")return "Нет разрешения на запросы к Claude. Включите его в меню разрешений этой страницы.";
  if(e.code==="rate_limited")return "Слишком много запросов подряд. Подождите минуту и повторите.";
  if(!navigator.onLine)return "Нет интернета.";
  return "Ошибка ("+(e.code||"?")+"): "+(e.message||"неизвестная");
}

}

function sentOf(w){
  const p=w.parentNode,r=document.createRange();r.setStart(p,0);r.setEndBefore(w);
  const off=r.toString().length,t=p.textContent,ss=t.match(/[^.!?]+[.!?]*/g)||[t];

}
